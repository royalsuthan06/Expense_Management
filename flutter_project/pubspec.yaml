name: dhantrack
description: Offline-first personal finance manager for Android using Drift SQLite and Riverpod.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.3
  path: ^1.9.0
  intl: ^0.19.0
  fl_chart: ^0.68.0
  local_auth: ^2.2.0
  file_picker: ^8.0.5
  share_plus: ^9.0.0
  csv: ^6.0.0
  shared_preferences: ^2.2.3
  uuid: ^4.4.0
  lucide_icons: ^0.257.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  drift_dev: ^2.18.0
  build_runner: ^2.4.9
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
